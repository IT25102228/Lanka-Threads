<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Change Password')}"></head>

<body
    class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-white transition-colors duration-400 font-sans min-h-screen">

    <div th:replace="~{fragments/layout :: sidebar('password', ${roleName})}"></div>

    <main class="pt-[130px] pb-12 px-6 lg:px-12 max-w-[800px] mx-auto min-h-screen flex flex-col">
        <!-- Header -->
        <div class="flex flex-wrap justify-between items-end mb-8 border-b border-black/10 dark:border-white/10 pb-4">
            <div>
                <h1 class="text-3xl font-light tracking-tight uppercase">Change Password</h1>
                <p class="text-gray-500 text-sm mt-1 tracking-widest uppercase">Secure your account</p>
            </div>
        </div>

        <!-- Messages -->
        <div th:if="${successMessage}"
            class="mb-6 p-4 rounded-xl bg-green-100/50 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-600 dark:text-green-400 text-sm font-medium tracking-wide flex items-center">
            <i class="bi bi-check2-circle me-2 text-lg"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}"
            class="mb-6 p-4 rounded-xl bg-red-100/50 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-600 dark:text-red-400 text-sm font-medium tracking-wide flex items-center">
            <i class="bi bi-exclamation-octagon me-2 text-lg"></i> <span th:text="${errorMessage}"></span>
        </div>

        <div
            class="bg-white dark:bg-dark-card/70 backdrop-blur-xl border border-black/5 dark:border-white/10 rounded-2xl shadow-soft dark:shadow-none p-6 md:p-8">
            <form th:action="@{/profile/password}" method="post">
                <div class="space-y-6">
                    <div>
                        <label for="currentPassword"
                            class="block text-[10px] font-semibold tracking-widest uppercase text-gray-500 mb-2">Current
                            Password</label>
                        <input type="password" id="currentPassword" name="currentPassword" required
                            class="w-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-light-text dark:text-white focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all">
                    </div>

                    <hr class="border-black/5 dark:border-white/10 my-6">

                    <div>
                        <label for="newPassword"
                            class="block text-[10px] font-semibold tracking-widest uppercase text-gray-500 mb-2">New
                            Password</label>
                        <input type="password" id="newPassword" name="newPassword" required
                            class="w-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-light-text dark:text-white focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all">
                        <p class="text-xs text-gray-400 dark:text-gray-500 mt-2 tracking-widest">Must be at least 8
                            characters long.</p>
                    </div>

                    <div>
                        <label for="confirmPassword"
                            class="block text-[10px] font-semibold tracking-widest uppercase text-gray-500 mb-2">Confirm
                            New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            class="w-full bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-xl px-4 py-3 text-sm text-light-text dark:text-white focus:outline-none focus:border-accent-primary focus:ring-1 focus:ring-accent-primary transition-all">
                    </div>
                </div>

                <div class="mt-8 flex justify-end">
                    <!-- Updated Update Password Button -->
                    <button type="submit"
                        class="bg-slate-900 dark:bg-slate-800 text-slate-600 dark:text-gray-300 rounded-full px-8 py-3 font-bold tracking-widest uppercase text-xs hover:-translate-y-1 hover:shadow-glow hover:text-emerald-300 dark:hover:bg-slate-700 hover:bg-slate-950 transition-all duration-300 flex items-center">
                        <i class="bi bi-key me-2 text-elegant-highlight"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
