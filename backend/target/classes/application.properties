spring.application.name=Lanka Threads

# --------------------------------------------------------------------------
# Active Database Configuration: Microsoft SQL Server (SSMS 22 / SQLEXPRESS)
# --------------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=lankathreads_db;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=lanka_user
spring.datasource.password=${DB_PASSWORD:Password123!}
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

