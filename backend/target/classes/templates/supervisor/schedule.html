<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Production Schedule')}"></head>
<body class="bg-light-bg dark:bg-dark-bg text-light-text dark:text-white transition-colors duration-400 font-sans min-h-screen">

<div th:replace="~{fragments/layout :: sidebar('schedule', 'Production Supervisor')}"></div>

<main class="pt-[150px] pb-12 px-6 lg:px-12 max-w-[1400px] mx-auto min-h-screen flex flex-col">
    <!-- Header -->
    <div class="flex justify-between items-end mb-8 border-b border-black/10 dark:border-white/10 pb-4">
        <div>
            <span class="inline-block bg-accent-primary/10 text-accent-primary text-xs font-bold tracking-widest uppercase px-3 py-1 rounded-full mb-3">Supervisor Hub</span>
            <h1 class="text-3xl font-light tracking-tight uppercase">Production Schedule</h1>
            <p class="text-gray-500 text-sm mt-1 tracking-widest uppercase">Manage Worker Line Assignments & Shifts</p>
        </div>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="mb-6 p-4 rounded-2xl bg-green-100/60 dark:bg-green-500/10 border border-green-200 dark:border-green-500/20 text-green-700 dark:text-green-400 text-sm font-medium tracking-wide flex items-center gap-3 animate-fade-in">
        <div class="w-8 h-8 rounded-full bg-green-500/10 flex items-center justify-center flex-shrink-0">
            <i class="bi bi-check2-circle text-green-500 text-lg"></i>
        </div>
        <span th:text="${success}">Assignment updated successfully.</span>
    </div>
    <div th:if="${error}" class="mb-6 p-4 rounded-2xl bg-red-100/60 dark:bg-red-500/10 border border-red-200 dark:border-red-500/20 text-red-700 dark:text-red-400 text-sm font-medium tracking-wide flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-red-500/10 flex items-center justify-center flex-shrink-0">
            <i class="bi bi-exclamation-octagon text-red-500 text-lg"></i>
        </div>
        <span th:text="${error}">Error occurred.</span>
    </div>

    <!-- Schedule Matrix -->
    <div class="bg-white dark:bg-dark-card/70 backdrop-blur-xl border border-black/5 dark:border-white/10 rounded-2xl shadow-soft dark:shadow-none overflow-hidden flex-1 flex flex-col">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
                <thead>
                    <tr>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs">Worker ID</th>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs">Name</th>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs text-center">Category</th>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs text-center">Active Line</th>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs text-center">Shift</th>
                        <th class="py-4 px-6 font-medium tracking-widest uppercase text-xs text-right">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-black/5 dark:divide-white/5">
                    <tr th:each="worker : ${workers}" class="hover:bg-black/5 dark:hover:bg-white/5 transition-colors group">
                        <!-- Worker Info -->
                        <td class="py-4 px-6 font-bold text-accent-primary tracking-widest" th:text="${worker.workerId}">W001</td>
                        <td class="py-4 px-6">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-accent-primary/10 flex items-center justify-center text-accent-primary font-bold text-xs" th:text="${#strings.substring(worker.name,0,1)}">J</div>
                                <span class="font-medium text-light-text dark:text-white uppercase tracking-wider" th:text="${worker.name}">John Doe</span>
                            </div>
                        </td>
                        
                        <td class="py-4 px-6 text-center">
                            <select name="categoryAssigned" th:form="'schedForm' + ${worker.id}" class="bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-full px-4 py-2 text-xs tracking-widest uppercase text-light-text dark:text-white focus:outline-none focus:border-accent-primary cursor-pointer transition-all appearance-none text-center min-w-[120px]">
                                <option value="Men" th:selected="${worker.categoryAssigned == 'Men'}">Men</option>
                                <option value="Women" th:selected="${worker.categoryAssigned == 'Women'}">Women</option>
                                <option value="Children" th:selected="${worker.categoryAssigned == 'Children'}">Children</option>
                            </select>
                        </td>
                        
                        <td class="py-4 px-6 text-center">
                            <select name="activeProductionLine" th:form="'schedForm' + ${worker.id}" class="bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-full px-4 py-2 text-xs tracking-widest uppercase text-light-text dark:text-white focus:outline-none focus:border-accent-primary cursor-pointer transition-all appearance-none text-center min-w-[120px]">
                                <option value="Line A" th:selected="${worker.activeProductionLine == 'Line A'}">Line A</option>
                                <option value="Line B" th:selected="${worker.activeProductionLine == 'Line B'}">Line B</option>
                                <option value="Line C" th:selected="${worker.activeProductionLine == 'Line C'}">Line C</option>
                                <option value="Line D" th:selected="${worker.activeProductionLine == 'Line D'}">Line D</option>
                                <option value="Line E" th:selected="${worker.activeProductionLine == 'Line E'}">Line E</option>
                            </select>
                        </td>
                        
                        <td class="py-4 px-6 text-center">
                            <select name="shift" th:form="'schedForm' + ${worker.id}" class="bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 rounded-full px-4 py-2 text-xs tracking-widest uppercase text-light-text dark:text-white focus:outline-none focus:border-accent-primary cursor-pointer transition-all appearance-none text-center min-w-[120px]">
                                <option value="Morning" th:selected="${worker.shift == 'Morning'}">Morning</option>
                                <option value="Evening" th:selected="${worker.shift == 'Evening'}">Evening</option>
                                <option value="Night" th:selected="${worker.shift == 'Night'}">Night</option>
                            </select>
                        </td>
                        
                        <td class="py-4 px-6 text-right">
                            <form th:id="'schedForm' + ${worker.id}" th:action="@{/supervisor/schedule/update}" method="post" class="inline m-0">
                                <input type="hidden" name="id" th:value="${worker.id}">
                                <button type="submit" class="bg-status-success/10 hover:bg-status-success/20 text-status-success border border-status-success/20 text-xs font-bold tracking-widest uppercase px-4 py-2 rounded-full transition-colors">
                                    Update
                                </button>
                            </form>
                        </td>
                    </tr>
                    
                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(workers)}">
                        <td colspan="6" class="py-16 text-center">
                            <div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-600">
                                <i class="bi bi-people text-4xl mb-3 opacity-50"></i>
                                <p class="text-sm font-light tracking-widest uppercase">No workers available for scheduling.</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
